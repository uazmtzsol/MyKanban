name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # JDK 21 matches maven.compiler.release=21 and avoids the JaCoCo
      # instrumentation error seen locally when building/running under JDK 25.
      - name: Run tests
        run: mvn -B test
